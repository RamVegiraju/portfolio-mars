backend:
  name: github
  repo: RamVegiraju/portfolio-mars
  branch: main
  auth_endpoint: api/auth
  # base_url is set to the current origin by index.html.

publish_mode: editorial_workflow
media_folder: public/images/uploads
public_folder: /images/uploads
show_preview_links: false
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: posts
    label: Writing
    label_singular: Post
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{date}}'
    sortable_fields: [date, title]
    view_filters:
      - label: Drafts hidden from website
        field: draft
        pattern: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, hint: 'A short summary for the archive, RSS, and social previews.' }
      - label: Date
        name: date
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss[Z]'
        date_format: 'MMM D, YYYY'
        time_format: 'HH:mm'
        picker_utc: true
        hint: 'Times are UTC. Future posts appear after the first site build at or after this date.'
      - label: Topics
        name: topics
        widget: list
        default: [Life]
        hint: 'Use Life, Boxing, AI/ML, Updates, or a new topic. Match an interest’s topic exactly to show the post on its page.'
      - label: Draft — hide from website
        name: draft
        widget: boolean
        default: true
        hint: 'Keep enabled while drafting. Before publishing, turn this off and save, then choose Ready and Publish.'
      - { label: Cover image, name: image, widget: image, required: false }
      - { label: Cover image description, name: imageAlt, widget: string, required: false, hint: 'Describe meaningful image content for readers using assistive technology.' }
      - { label: Body, name: body, widget: markdown }
  - name: site
    label: Site settings
    files:
      - name: interests
        label: Interests and tabs
        file: src/data/interests.json
        fields:
          - name: interests
            label: Interests
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Tab title, widget: string }
              - name: slug
                label: URL name
                widget: string
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase words separated by hyphens.']
                hint: 'Unique URL, e.g. boxing. Do not use home, professional, writing, videos, about, admin, api, or 404.'
              - { name: heading, label: Page heading, widget: string }
              - { name: topic, label: Matching blog topic, widget: string, hint: 'Posts with this exact topic appear on the interest page.' }
              - { name: description, label: Short description, widget: text }
              - { name: intro, label: Introduction, widget: text, hint: 'Separate paragraphs with a blank line. Boxing and NYC use their own settings below.' }
      - name: boxing-journey
        label: Boxing journey
        file: src/data/boxing-journey.json
        fields:
          - { name: opening, label: Opening line, widget: text }
          - { name: introClosing, label: Intro closing paragraph, widget: text }
          - name: milestones
            label: Timeline
            widget: list
            summary: '{{fields.period}} — {{fields.title}}'
            fields:
              - { name: id, label: Milestone ID, widget: string, hint: 'Keep existing IDs so their photos and videos stay attached. Use a new lowercase ID for a new milestone.' }
              - { name: period, label: Date or period, widget: string }
              - { name: title, label: Heading, widget: string }
              - name: paragraphs
                label: Paragraphs
                widget: list
                field: { name: paragraph, label: Paragraph, widget: text }
          - { name: instagramUrl, label: Training Instagram link, widget: string }
          - name: coach
            label: Coach
            widget: object
            fields:
              - { name: name, label: Name, widget: string }
              - { name: instagramUrl, label: Instagram link, widget: string }
              - { name: note, label: Personal note, widget: text }
      - name: nyc
        label: NYC guide
        file: src/data/nyc.json
        fields:
          - name: intro
            label: Introduction paragraphs
            widget: list
            field: { name: paragraph, label: Paragraph, widget: text }
          - name: restaurants
            label: Favorite restaurants
            widget: list
            required: false
            summary: '{{fields.name}} — {{fields.cuisine}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: cuisine, label: Cuisine, widget: string, hint: 'Use consistent cuisine names for the filters.' }
              - { name: neighborhood, label: Neighborhood, widget: string, required: false }
              - { name: note, label: Why I like it, widget: text, required: false }
              - { name: url, label: Website or map link, widget: string, required: false }
          - name: nightlife
            label: Nightlife
            widget: list
            required: false
            summary: '{{fields.name}} — {{fields.category}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: category, label: Category, widget: select, options: ['Speakeasies & cocktails', 'Clubs & venues'] }
              - { name: neighborhood, label: Neighborhood, widget: string, required: false }
              - { name: note, label: Why I like it, widget: text, required: false }
              - { name: url, label: Website or map link, widget: string, required: false }
          - name: moments
            label: Photos and moments
            widget: list
            required: false
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Image description, widget: string }
              - { name: caption, label: Caption, widget: text }
