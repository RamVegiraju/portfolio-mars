<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Writing editor | Ram Vegiraju</title>
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <script>window.CMS_MANUAL_INIT = true;</script>
  </head>
  <body>
    <noscript>This editor needs JavaScript. You can also write Markdown in the GitHub repository.</noscript>
    <script src="https://unpkg.com/decap-cms@3.18.0/dist/decap-cms.js" integrity="sha256-/zJFJGW7bRhVe1PTNF2kx50T4OT6vHSXHnLhFSvaOE4=" crossorigin="anonymous"></script>
    <script>
      if (window.CMS) {
        CMS.init({ config: { backend: { base_url: window.location.origin }, site_url: window.location.origin, display_url: window.location.origin } });
        CMS.registerPreviewStyle('/admin/preview.css');
        CMS.registerEventListener({
          name: 'prePublish',
          handler: ({ entry }) => {
            if (entry.getIn(['data', 'draft'])) {
              throw new Error('Turn off “Draft — hide from website” and save the entry before publishing.');
            }
          },
        });
      } else {
        document.body.textContent = 'The writing editor could not load. Please check your connection and reload.';
      }
    </script>
  </body>
</html>
